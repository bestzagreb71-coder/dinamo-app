<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dinamo Line Up TV</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050d24;--card:#0c1a40;--line:#1d3170;--blue:#1b4fd8;--accent:#5fd8ff;--txt:#eaf1ff;--mut:#8ea3d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Barlow Condensed",Arial Narrow,sans-serif;font-size:18px}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 80px}
h1{font-size:26px;margin:6px 0 10px;letter-spacing:1px}
h1 span{color:var(--accent)}
canvas{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);background:#000}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button,.fbtn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:12px 16px;font:700 18px "Barlow Condensed",sans-serif;letter-spacing:.5px;cursor:pointer}
button.sec,.fbtn{background:#16275c}
button.rec{background:#c62828}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:0 12px}
summary{padding:12px 0;font-weight:800;font-size:20px;cursor:pointer;color:var(--accent)}
label{display:block;color:var(--mut);margin:10px 0 4px;font-size:16px}
input[type=text],input[type=number],select,textarea{width:100%;background:#071333;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:10px;font:600 18px "Barlow Condensed",sans-serif}
textarea{min-height:120px}
.prow{display:flex;gap:6px;align-items:center;margin:6px 0}
.prow .num{width:62px;flex:none;text-align:center}
.prow .nm{flex:1;min-width:0}
.prow .fbtn{padding:9px 10px;flex:none;font-size:16px}
.prow img{width:38px;height:38px;object-fit:cover;border-radius:6px;background:#071333;flex:none}
.cap{display:flex;align-items:center;gap:3px;color:var(--mut);font-size:15px;flex:none}
.cap input{width:20px;height:20px}
.tag{color:var(--accent);font-size:14px;margin:10px 0 0;letter-spacing:1px}
input[type=file]{display:none}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.small{color:var(--mut);font-size:15px;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>DINAMO <span>LINE UP</span> TV</h1>
  <canvas id="cv"></canvas>
  <div class="btns">
    <button id="bPlay">▶ Pokreni animaciju</button>
    <button id="bRec" class="rec">● Snimi video</button>
    <button id="bPng" class="sec">⬇ PNG završne slike</button>
    <button id="bIntro" class="sec">▶ Samo intro</button>
  </div>
  <div class="row2"><label style="margin:0">Format:</label><select id="format" style="width:auto"><option value="land">16:9 (1920×1080)</option><option value="port">Story (1080×1920)</option></select></div>
  <div class="row2" style="margin-top:8px"><label style="margin:0">Intro:</label><select id="intro" style="width:auto"><option value="0">Bez introa</option><option value="1">Intro 1 – Grb i sjaj</option><option value="2">Intro 2 – Dijagonale</option><option value="3">Intro 3 – Crtanje terena</option></select></div>
  <div class="small" id="status"></div>

  <details open>
    <summary>1. Postava</summary>
    <label>Formacija</label>
    <select id="formation"></select>
    <div id="plist"></div>
    <div class="small">Redoslijed: vratar, pa obrana, veza, napad (slijeva udesno). Fotka najbolje radi kao PNG izrezan bez pozadine.</div>
  </details>

  <details>
    <summary>2. Trener i desni panel</summary>
    <label>Ime trenera</label><input type="text" id="coach" placeholder="npr. I. PREZIME">
    <div class="row2"><label class="fbtn">Fotka trenera<input type="file" id="fCoach" accept="image/*"></label><img id="tCoach" width="38" height="38" style="border-radius:6px;display:none"></div>
    <label>Što piše u desnom panelu</label>
    <select id="panelMode"><option value="start">Početnih 11 (automatski)</option><option value="subs">Rezerve (upisujem ručno)</option></select>
    <label>Naslov panela</label><input type="text" id="panelTitle">
    <div id="subsBox" style="display:none"><label>Rezerve (svaki red: broj ime)</label><textarea id="subs" placeholder="12 I. PREZIME&#10;24 I. PREZIME"></textarea></div>
  </details>

  <details>
    <summary>3. Grb, logo i izgled</summary>
    <div class="row2"><label class="fbtn">Učitaj grb (PNG)<input type="file" id="fCrest" accept="image/*"></label><button class="sec" id="xCrest">Makni</button></div>
    <div class="small">Grb se pamti u ovom pregledniku, učitaš ga samo jednom. Dok ga ne učitaš, prikazuje se zamjenski štit.</div>
    <div class="row2"><label class="fbtn">Logo lige (gore lijevo)<input type="file" id="fLeague" accept="image/*"></label><button class="sec" id="xLeague">Makni</button></div>
    <div class="row2" style="margin-top:8px"><label class="fbtn">Pozadina (tvoja fotka)<input type="file" id="fBg" accept="image/*"></label><button class="sec" id="xBg">Makni</button></div>
    <label>Zatamnjenje pozadine: <span id="dimV"></span></label><input type="range" id="dim" min="0" max="85" style="width:100%">
    <label>Naslov u introu</label><input type="text" id="introTitle" placeholder="LINE UP">
    <label>Boja linija terena</label>
    <div class="row2"><input type="color" id="lineColor" style="width:70px;height:46px;padding:2px;background:#071333;border:1px solid var(--line);border-radius:6px">
      <button class="sec" data-c="#5fd8ff">Plava</button><button class="sec" data-c="#ffffff">Bijela</button><button class="sec" data-c="#ffd43b">Žuta</button><button class="sec" data-c="#69f0ae">Zelena</button><button class="sec" data-c="#ff5252">Crvena</button></div>
    <label>Natpis gore lijevo</label><input type="text" id="match" placeholder="npr. GNK DINAMO – HNK RIJEKA • 17:00">
    <label>Instagram oznaka dolje lijevo</label><input type="text" id="handle" placeholder="@tvoj_profil">
    <label><input type="checkbox" id="cutout" style="width:auto"> Fotke su izrezane (PNG bez pozadine). Isključi ako su obične fotke.</label>
    <label>Trajanje po redu: <span id="holdV"></span> s</label><input type="range" id="hold" min="1500" max="3600" step="100" style="width:100%">
  </details>
</div>

<script>
/* ============ 1. POSTAVKE I SPREMANJE ============ */
let W = 1920, H = 1080, LAY;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeO = t => 1 - Math.pow(1 - t, 3);
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const FORMATIONS = ['4-2-3-1', '4-3-3', '4-4-2', '4-1-4-1', '4-3-1-2', '4-5-1', '3-5-2', '3-4-3', '5-3-2'];

let S = {
  formation: '4-2-3-1',
  players: Array.from({ length: 11 }, (_, i) => ({ num: String(i + 1), name: '', cap: false })),
  coach: '', match: '', handle: '', dim: 45, cutout: true, hold: 2200,
  intro: '1', introTitle: 'LINE UP', format: 'land', lineColor: '#5fd8ff', panelMode: 'start', panelTitle: 'POČETNA POSTAVA', subs: ''
};
try { const j = JSON.parse(localStorage.getItem('dz_lineup_v1')); if (j) S = Object.assign(S, j); } catch (e) {}
/* FORMATI: land = 16:9 (1920x1080), port = story (1080x1920) */
const LAYS = {
  land: { pw0: .64, pw1: 1.2, ex: .2, v0: .12, v1: .92, W: 1920, H: 1080, y0: 150, ys: 950, bigBy: 985, sp: 1.1, land: true, base: R => R <= 4 ? 195 : 162 },
  port: { pw0: .80, pw1: .94, ex: 0, v0: .12, v1: .86, W: 1080, H: 1920, y0: 430, ys: 1050, bigBy: 1500, sp: 1.04, land: false, base: R => R <= 4 ? 185 : 158 }
};
function applyFormat() {
  if (!LAYS[S.format]) S.format = 'land';
  LAY = LAYS[S.format]; W = LAY.W; H = LAY.H; cv.width = W; cv.height = H;
  cv.style.maxWidth = LAY.land ? 'none' : '380px'; cv.style.margin = '0 auto';
}
applyFormat();
function save() { try { localStorage.setItem('dz_lineup_v1', JSON.stringify(S)); } catch (e) {} }

/* slike spremamo u IndexedDB (localStorage je premalen za fotke) */
const DB = () => new Promise((res, rej) => { const r = indexedDB.open('dz_lineup', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function idbSet(k, v) { try { const db = await DB(); db.transaction('img', 'readwrite').objectStore('img').put(v, k); } catch (e) {} }
async function idbDel(k) { try { const db = await DB(); db.transaction('img', 'readwrite').objectStore('img').delete(k); } catch (e) {} }
async function idbGet(k) { try { const db = await DB(); return await new Promise(r => { const q = db.transaction('img').objectStore('img').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch (e) { return null; } }

const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
const imgs = { crest: null, league: null, bg: null, coach: null, p: Array(11).fill(null) };
const cache = { coach: null, p: Array(11).fill(null) };

async function fileToData(file, max, type) {
  const url = URL.createObjectURL(file); const img = await loadImg(url);
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  return c.toDataURL(type, .9);
}

/* fotku igrača pripremimo jednom: smještaj u okvir + nježno blijeđenje prema dolje */
function makeMasked(img) {
  const cw = 500, ch = 625, c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d');
  if (S.cutout) {
    const s = Math.min(cw / img.width, ch / img.height), dw = img.width * s, dh = img.height * s;
    g.drawImage(img, (cw - dw) / 2, ch - dh, dw, dh);
  } else {
    const s = Math.max(cw / img.width, ch / img.height), dw = img.width * s, dh = img.height * s;
    g.drawImage(img, (cw - dw) / 2, 0, dw, dh);
  }
  g.globalCompositeOperation = 'destination-in';
  const gr = g.createLinearGradient(0, 0, 0, ch);
  gr.addColorStop(0, S.cutout ? '#000' : 'rgba(0,0,0,.0)'); gr.addColorStop(S.cutout ? 0 : .12, '#000');
  gr.addColorStop(.74, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, cw, ch);
  return c;
}
function rebuildCache() {
  imgs.p.forEach((im, i) => cache.p[i] = im ? makeMasked(im) : null);
  cache.coach = imgs.coach ? makeMasked(imgs.coach) : null;
}
async function setImage(key, file, max, type) {
  const data = await fileToData(file, max, type); await idbSet(key, data);
  await applyKey(key, data); rebuildCache(); showFinal();
}
async function applyKey(key, data) {
  const im = data ? await loadImg(data) : null;
  if (key.startsWith('p') && key.length <= 3) { const i = +key.slice(1); imgs.p[i] = im; const t = $('th' + i); if (t) { t.src = data || ''; t.style.display = data ? '' : 'none'; } }
  else imgs[key] = im;
  if (key === 'coach') { $('tCoach').src = data || ''; $('tCoach').style.display = data ? '' : 'none'; }
}
async function removeImage(key) { await idbDel(key); await applyKey(key, null); rebuildCache(); showFinal(); }

/* ============ 2. FORMACIJA I POZICIJE ============ */
const rowsOf = () => [1, ...S.formation.split('-').map(Number)];
function slotsOf() { const out = []; rowsOf().forEach((n, k) => { for (let j = 0; j < n; j++) out.push({ k, j, n }); }); return out; }

/* ============ 3. VREMENSKA LINIJA ============ */
function timing0() {
  const R = rowsOf().length, gap = S.hold, Sx = [];
  for (let k = 0; k < R; k++) Sx.push(600 + k * gap);
  const finStart = Sx[R - 1] + gap;
  return { S: Sx, gap, finStart, total: finStart + 900 + 3000 };
}

const INTRO_MS = 3000;
const introLen = () => (S.intro && S.intro !== '0') ? INTRO_MS : 0;
function timing() { const b = timing0(), D = introLen(); return Object.assign({}, b, { D, total: b.total + D }); }

/* ============ 4. CRTANJE ============ */
const FONT = (w, s) => `${w} ${s}px "Barlow Condensed","Arial Narrow",Arial,sans-serif`;
const ACC = '#5fd8ff';

function proj(u, v, sw) { // perspektiva terena: u=lijevo-desno (0..1), v=gore(daleko)-dolje(blizu) (0..1)
  const wv = sw * (LAY.pw0 + (LAY.pw1 - LAY.pw0) * v);
  return { x: sw / 2 + (u - .5) * wv, y: LAY.y0 + v * LAY.ys, k: .62 + .5 * v };
}

function drawBG() {
  if (imgs.bg) {
    const im = imgs.bg, s = Math.max(W / im.width, H / im.height), dw = im.width * s, dh = im.height * s;
    ctx.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#13307a'); g.addColorStop(.45, '#0a1f55'); g.addColorStop(1, '#041033');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 9; i++) { ctx.fillStyle = 'rgba(255,255,255,' + (i % 2 ? .035 : 0) + ')'; ctx.fillRect(0, LAY.y0 + i * LAY.ys / 9, W, LAY.ys / 9); }
  }
  ctx.fillStyle = `rgba(5,18,60,${S.dim / 100})`; ctx.fillRect(0, 0, W, H);
}

function drawPitch(sw) {
  const P = (u, v) => proj(u, v, sw);
  const poly = (pts, close) => { ctx.beginPath(); pts.forEach((p, i) => { const q = P(p[0], p[1]); i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); }); if (close) ctx.closePath(); ctx.stroke(); };
  const lc = S.lineColor || ACC, rr = parseInt(lc.slice(1, 3), 16), gg = parseInt(lc.slice(3, 5), 16), bb = parseInt(lc.slice(5, 7), 16);
  ctx.save(); ctx.strokeStyle = lc; ctx.lineWidth = 7; ctx.lineJoin = 'round'; ctx.shadowColor = `rgba(${rr},${gg},${bb},.7)`; ctx.shadowBlur = 14; ctx.globalAlpha = .92;
  const e = LAY.ex;
  poly([[-e, 0], [1 + e, 0]]);
  poly([[0, 0], [0, 1]]); poly([[1, 0], [1, 1]]);   // bocne linije                                  // gol-linija gore
  poly([[.2, 0], [.2, .2], [.8, .2], [.8, 0]]);               // veliki sesnaesterac gore
  poly([[.36, 0], [.36, .07], [.64, .07], [.64, 0]]);         // mali
  poly([[-e, .5], [1 + e, .5]]);
  if (!LAY.land) poly([[0, 1], [1, 1]]);                                // sredina
  const circ = []; for (let a = 0; a <= 64; a++) circ.push([.5 + Math.cos(a / 64 * 6.2832) * .15, .5 + Math.sin(a / 64 * 6.2832) * .085]);
  poly(circ);
  poly([[.2, 1], [.2, .8], [.8, .8], [.8, 1]]);               // dolje
  poly([[.36, 1], [.36, .93], [.64, .93], [.64, 1]]);
  poly([[.5 - .012, .8], [.5 + .012, .8]]);
  ctx.restore();
}

function drawCrest(cx, cy, size) {
  if (imgs.crest) { const im = imgs.crest, s = Math.min(size / im.width, size / im.height); ctx.drawImage(im, cx - im.width * s / 2, cy - im.height * s / 2, im.width * s, im.height * s); return; }
  // zamjenski stit (dok ne ucitas pravi grb)
  const w = size * .82, h = size, x = cx - w / 2, y = cy - h / 2;
  const sh = (i) => { ctx.beginPath(); ctx.moveTo(x + i, y + i); ctx.lineTo(x + w - i, y + i); ctx.lineTo(x + w - i, y + h * .55); ctx.quadraticCurveTo(x + w - i, y + h * .85, cx, y + h - i); ctx.quadraticCurveTo(x + i, y + h * .85, x + i, y + h * .55); ctx.closePath(); };
  ctx.save(); sh(0); ctx.fillStyle = '#fff'; ctx.fill(); sh(size * .05); ctx.fillStyle = '#0d3cc4'; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = FONT(800, size * .26);
  ctx.fillText('GNK', cx, cy - size * .16); ctx.font = FONT(800, size * .2); ctx.fillText('DINAMO', cx, cy + size * .08);
  ctx.font = FONT(700, size * .13); ctx.fillText('ZAGREB', cx, cy + size * .28); ctx.restore();
}

function silhouette(cx, pb, pw, ph) {
  ctx.save(); ctx.fillStyle = 'rgba(140,185,255,.28)';
  ctx.beginPath(); ctx.arc(cx, pb - ph * .66, pw * .16, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - pw * .36, pb); ctx.quadraticCurveTo(cx - pw * .34, pb - ph * .42, cx, pb - ph * .46); ctx.quadraticCurveTo(cx + pw * .34, pb - ph * .42, cx + pw * .36, pb); ctx.closePath(); ctx.fill(); ctx.restore();
}

function fitText(txt, maxW, size, weight) {
  let s = size; ctx.font = FONT(weight, s);
  while (ctx.measureText(txt).width > maxW && s > 10) { s -= 2; ctx.font = FONT(weight, s); }
}

function drawPlayer(i, cx, by, w, alpha, pk) {
  const P = S.players[i], h = w * .54, x = cx - w / 2, y = by - h;
  ctx.save(); ctx.globalAlpha = alpha;
  const pw = w * pk, ph = pw * 1.25, pb = y + h * .62;
  const m = cache.p[i]; if (m) ctx.drawImage(m, cx - pw / 2, pb - ph, pw, ph); else silhouette(cx, pb, pw, ph);
  const c = w * .09;
  ctx.beginPath(); ctx.moveTo(x + c, y); ctx.lineTo(x + w - c, y); ctx.lineTo(x + w, y + c); ctx.lineTo(x + w, by); ctx.lineTo(x, by); ctx.lineTo(x, y + c); ctx.closePath();
  const g = ctx.createLinearGradient(0, y, 0, by); g.addColorStop(0, 'rgba(24,70,205,0)'); g.addColorStop(.38, 'rgba(24,70,205,.86)'); g.addColorStop(1, '#091f72');
  ctx.fillStyle = g; ctx.fill();
    // Višebojna linija ispod imena igrača: PLAVA – BIJELA – CRNA – BIJELA – PLAVA
  const gradPlayerLine = ctx.createLinearGradient(x, 0, x + w, 0);
  gradPlayerLine.addColorStop(0.0, '#1b4fd8'); // PLAVA
  gradPlayerLine.addColorStop(0.25, '#ffffff'); // BIJELA
  gradPlayerLine.addColorStop(0.5, '#000000'); // CRNA
  gradPlayerLine.addColorStop(0.75, '#ffffff'); // BIJELA
  gradPlayerLine.addColorStop(1.0, '#1b4fd8'); // PLAVA
  ctx.fillStyle = gradPlayerLine;
  ctx.fillRect(x, by - w * .022, w, Math.max(3, w * .025));

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = ACC; ctx.font = FONT(800, h * .56); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 6;
  ctx.fillText(P.num || '', cx, y + h * .64); ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff'; fitText((P.name || 'IGRAČ ' + (i + 1)).toUpperCase(), w * .9, h * .22, 700);
  ctx.fillText((P.name || 'IGRAČ ' + (i + 1)).toUpperCase(), cx, by - h * .17);
  if (P.cap) { ctx.fillStyle = ACC; const bw = w * .14; ctx.fillRect(x + w * .07, y + h * .22, bw, bw * .8); ctx.fillStyle = '#062'; ctx.fillStyle = '#041a55'; ctx.font = FONT(800, bw * .75); ctx.fillText('C', x + w * .07 + bw / 2, y + h * .22 + bw * .68); }
  ctx.restore();
}
function drawInstaIcon(x, y, s) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.lineWidth = s * .09; ctx.shadowBlur = 0;
  const r = s * .3;
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + s, y, x + s, y + s, r); ctx.arcTo(x + s, y + s, x, y + s, r);
  ctx.arcTo(x, y + s, x, y, r); ctx.arcTo(x, y, x + s, y, r);
  ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, s * .23, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + s * .76, y + s * .24, s * .06, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawTopLeft() {
  
if (!LAY.land) {
  if (imgs.league) {
    const im = imgs.league;
    const s = Math.min(110 / im.width, 110 / im.height);
    ctx.drawImage(im, 40, 40, im.width * s, im.height * s);
  }

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.7)';
  ctx.shadowBlur = 8;

  // Natpis utakmice
  if (S.match) {
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    fitText(S.match.toUpperCase(), W - 80, 40, 700);
    ctx.fillText(S.match.toUpperCase(), W / 2, 352);
  }

  // Instagram ikona i potpis - poravnani zajedno
  if (S.handle) {
    const iconSize = 34;
    const gap = 14;
    const rightMargin = 40;

    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    // Smanji font ako je potpis predugačak
    fitText(S.handle, W - 180, 30, 600);

    const textWidth = ctx.measureText(S.handle).width;
    const textX = W - rightMargin;
    const textY = 70;
    const iconX = textX - textWidth - gap - iconSize;

    // Instagram ikona
    drawInstaIcon(iconX, textY - iconSize / 2, iconSize);

    // Potpis
    ctx.fillText(S.handle, textX, textY);
  }

  ctx.restore();
  return;
}

  let x = 60;
  if (imgs.league) { const im = imgs.league, s = Math.min(110 / im.width, 110 / im.height); ctx.drawImage(im, x, 40, im.width * s, im.height * s); x += im.width * s + 24; }
  if (S.match) { ctx.save(); ctx.fillStyle = '#fff'; ctx.font = FONT(700, 38); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 8; ctx.fillText(S.match.toUpperCase(), x, 92); ctx.restore(); }
  if (S.handle) { ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = FONT(600, 30); ctx.textAlign = 'left'; ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 8; ctx.fillText(S.handle, 60, 1040); ctx.restore(); }
}

function subsLines() {
  if (S.panelMode === 'subs') return S.subs.split('\n').map(l => l.trim()).filter(Boolean).slice(0, 14).map(l => { const m = l.match(/^(\d+)\s+(.*)$/); return m ? [m[1], m[2]] : ['', l]; });
  return S.players.map(p => [p.num, p.name || '']);
}

function drawPanel(fin, formTxt) { LAY.land ? drawPanelL(fin, formTxt) : drawPanelP(fin, formTxt); }

/* story: traka s grbom i formacijom na vrhu, popis (11 + trener) izlazi odozdo */
function drawPanelP(fin, formTxt) {
  const cx = W / 2, hh = 310;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, hh - 70); ctx.lineTo(cx, hh); ctx.lineTo(0, hh - 70); ctx.closePath();
  const g = ctx.createLinearGradient(0, 0, 0, hh); g.addColorStop(0, '#1b3fdo'); g.addColorStop(1, '#0f2a98'); ctx.fillStyle = g; ctx.fill(); ctx.restore();
  drawCrest(cx, 100, 130);
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff'; ctx.font = FONT(800, 58); ctx.fillText(formTxt, cx, 250); ctx.restore();
  if (fin <= 0) return;
  const PH = 400, y0 = H - PH * fin;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, y0 + 55); ctx.lineTo(cx, y0); ctx.lineTo(W, y0 + 55); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  const g2 = ctx.createLinearGradient(0, y0, 0, H); g2.addColorStop(0, '#1b3fd0'); g2.addColorStop(1, '#0a1f72'); ctx.fillStyle = g2; ctx.fill();
  ctx.globalAlpha = clamp((fin - .4) / .6); ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = FONT(800, 36); ctx.fillText((S.panelMode === 'subs' ? 'REZERVE' : S.panelTitle || 'POSTAVA').toUpperCase(), 40, y0 + 108);
  ctx.fillStyle = ACC; ctx.fillRect(40, y0 + 120, W - 80, 3);
  const L = subsLines(), per = Math.ceil(L.length / 2), step = Math.min(40, 215 / Math.max(per - 1, 1));
  L.forEach((r, i) => {
    const col = i < per ? 0 : 1, row = i < per ? i : i - per, ox = col * 345, y = y0 + 165 + row * step;
    ctx.fillStyle = ACC; ctx.textAlign = 'right'; ctx.font = FONT(800, 28); ctx.fillText(r[0], 40 + ox + 62, y);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; fitText((r[1] || '').toUpperCase(), 215, 28, 700); ctx.fillText((r[1] || '').toUpperCase(), 40 + ox + 78, y);
  });
  if (cache.coach) ctx.drawImage(cache.coach, 800, y0 + 128, 104, 130);
  ctx.textAlign = 'left'; ctx.fillStyle = ACC; ctx.font = FONT(800, 28); ctx.fillText('TRENER', 760, y0 + 292);
  ctx.fillStyle = '#fff'; fitText((S.coach || '').toUpperCase(), 285, 30, 700); ctx.fillText((S.coach || '').toUpperCase(), 760, y0 + 326);
  ctx.restore();
}

function drawPanelL(fin, formTxt) {
  const PW = 455, x0 = W - PW, hh = lerp(310, 1190, fin), cx = x0 + PW / 2;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, hh - 80); ctx.lineTo(cx, hh); ctx.lineTo(x0, hh - 80); ctx.closePath();
  const g = ctx.createLinearGradient(0, 0, 0, hh); g.addColorStop(0, '#1b3fd0'); g.addColorStop(.6, '#1537b8'); g.addColorStop(1, '#0a1f72');
  ctx.fillStyle = g; ctx.fill();
  ctx.clip();
  ctx.fillStyle = 'rgba(95,216,255,.10)'; ctx.beginPath(); ctx.moveTo(x0, 150); ctx.lineTo(W, 60); ctx.lineTo(W, 130); ctx.lineTo(x0, 220); ctx.fill();
  ctx.restore();
  drawCrest(cx, 100, 130);
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff'; ctx.font = FONT(800, 58); ctx.fillText(formTxt, cx, 245);
  const la = clamp((fin - .35) / .65);
  if (la > 0) {
    ctx.globalAlpha = la;
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = FONT(800, 38); ctx.fillText((S.panelMode === 'subs' ? 'REZERVE' : S.panelTitle || 'POSTAVA').toUpperCase(), x0 + 36, 305);
    ctx.fillStyle = ACC; ctx.fillRect(x0 + 36, 316, PW - 72, 3);
    const L = subsLines(), step = Math.min(46, 520 / Math.max(L.length, 1));
    L.forEach((r, i) => {
      const y = 362 + i * step;
      ctx.fillStyle = ACC; ctx.textAlign = 'right'; ctx.font = FONT(800, 32); ctx.fillText(r[0], x0 + 100, y);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; fitText((r[1] || '').toUpperCase(), PW - 150, 36, 700); ctx.fillText((r[1] || '').toUpperCase(), x0 + 118, y);
    });
    // trener
    const cy = 1010;
    if (cache.coach) ctx.drawImage(cache.coach, x0 + 24, cy - 110, 130, 162);
    ctx.textAlign = 'left'; ctx.fillStyle = ACC; ctx.font = FONT(800, 30); ctx.fillText('TRENER', x0 + 175, cy - 10);
    ctx.fillStyle = '#fff'; fitText((S.coach || '').toUpperCase(), PW - 200, 34, 700); ctx.fillText((S.coach || '').toUpperCase(), x0 + 175, cy + 28);
  }
  ctx.restore();
}

function renderMain(t) {
  const rows = rowsOf(), R = rows.length, T = timing0();
  const fin = easeIO(clamp((t - T.finStart) / 900)), sw = LAY.land ? lerp(W, 1465, fin) : W;
  ctx.clearRect(0, 0, W, H);
  drawBG(); drawPitch(sw);
  const base = LAY.base(R), items = [];
  slotsOf().forEach((sl, i) => {
    const S0 = T.S[sl.k], a = clamp((t - S0 - sl.j * 130) / 600);
    if (a <= 0) return;
    const ae = easeO(a), sh = easeIO(clamp((t - (S0 + T.gap - 300)) / 700));
    const bigW = Math.min(330, (W - 80) / sl.n), cxBig = W / 2 + ((sl.j + .5) / sl.n - .5) * sl.n * bigW * LAY.sp;
    const v = LAY.v0 + sl.k * ((LAY.v1 - LAY.v0) / (R - 1)), u = .5 + ((sl.j + .5) / sl.n - .5) * .88, pr = proj(u, v, sw), sp = sw * (LAY.pw0 + (LAY.pw1 - LAY.pw0) * v) * .88 / sl.n * .96, ws = Math.min(base * pr.k, sp);
    const alpha = lerp(lerp(ae, .6, sh), 1, fin);
    items.push({ i, key: sh < 1 ? 10 + sl.k : v, cx: lerp(cxBig, pr.x, sh), by: lerp(LAY.bigBy, pr.y, sh) + (1 - ae) * 70, w: lerp(bigW, ws, sh), alpha, pk: lerp(1.12, .9, sh) });
  });
  items.sort((a, b) => a.key - b.key).forEach(o => drawPlayer(o.i, o.cx, o.by, o.w, o.alpha, o.pk));
  // formacija se "tipka" kako se redovi otkrivaju: 4- → 4-2- → 4-2-3- → 4-2-3-1
  let kRev = -1; T.S.forEach((s, k) => { if (t >= s) kRev = k; });
  const f = rows.slice(1); let txt = '';
  if (kRev >= 1) txt = f.slice(0, kRev).join('-') + (kRev < R - 1 ? '-' : '');
  drawPanel(fin, txt); drawTopLeft();
}

/* ============ INTRO (3 verzije) ============ */
const easeB = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function introTexts(alpha, y, fs) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  try { ctx.letterSpacing = Math.round(fs * .08) + 'px'; } catch (e) {}
  ctx.fillStyle = '#fff'; ctx.font = FONT(800, fs); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 20;
  ctx.fillText((S.introTitle || 'LINE UP').toUpperCase(), W / 2, y);
  if (S.match) { ctx.shadowBlur = 8; ctx.fillStyle = ACC; ctx.font = FONT(700, fs * .24); fitText(S.match.toUpperCase(), W - 100, fs * .24, 700); ctx.fillText(S.match.toUpperCase(), W / 2, y + fs * .72); }
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.restore();
}
function drawIntro(t, kind) {
  const D = INTRO_MS, cx = W / 2, cy = H / 2, fs = Math.min(W * .13, 200), fade = 1 - clamp((t - (D - 600)) / 600);
  renderMain(0);
  if (kind === '1') {            // GRB: sjaj, valovi svjetla i naslov
    ctx.save(); ctx.globalAlpha = fade;
    const g = ctx.createRadialGradient(cx, cy, 50, cx, cy, Math.max(W, H) * .7); g.addColorStop(0, '#1a45c4'); g.addColorStop(1, '#030a22'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const my = cy - H * .06;
    for (let r = 0; r < 2; r++) { const q = clamp((t - 300 - r * 450) / 1500); ctx.globalAlpha = fade * (1 - q) * .6; ctx.strokeStyle = ACC; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, my, lerp(80, Math.min(W, H) * .6, easeO(q)), 0, 7); ctx.stroke(); }
    ctx.save(); ctx.globalAlpha = fade * clamp(t / 500); ctx.translate(cx, my); const sc = lerp(.55, 1, easeO(clamp(t / 1300))); ctx.scale(sc, sc); ctx.shadowColor = 'rgba(95,216,255,.6)'; ctx.shadowBlur = 50; drawCrest(0, 0, Math.min(W, H) * .36); ctx.restore();
    const sp = clamp((t - 700) / 1000), sx = lerp(-W * .3, W * 1.3, sp); ctx.globalAlpha = fade * Math.sin(sp * Math.PI) * .18; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx + W * .12, 0); ctx.lineTo(sx + W * .12 - H * .3, H); ctx.lineTo(sx - H * .3, H); ctx.fill();
    ctx.restore();
    const tp = easeO(clamp((t - 1000) / 700)); introTexts(fade * tp, cy + H * .2 + (1 - tp) * 40, fs);
  } else if (kind === '2') {     // DIJAGONALE: plave trake preplave ekran, naslov, pa odlaze
    const sk = H * .3, poly = tx => { ctx.beginPath(); ctx.moveTo(tx, 0); ctx.lineTo(tx + W + sk, 0); ctx.lineTo(tx + W, H); ctx.lineTo(tx - sk, H); ctx.closePath(); };
    const pin = easeO(clamp(t / 700)), pout = easeIO(clamp((t - 2100) / 700)), L = W + sk * 2;
    const tx = t < 1400 ? -L * (1 - pin) : L * pout;
    ctx.save(); poly(tx + 70); ctx.fillStyle = ACC; ctx.fill();
    poly(tx); const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#1b3fd0'); g.addColorStop(1, '#071a66'); ctx.fillStyle = g; ctx.fill(); ctx.restore();
    const tp = easeO(clamp((t - 500) / 600)) * (1 - clamp((t - 1950) / 250));
    ctx.save(); ctx.globalAlpha = tp; ctx.translate(cx, cy - H * .12); const sc = lerp(.7, 1, tp); ctx.scale(sc, sc); drawCrest(0, 0, Math.min(W, H) * .24); ctx.restore();
    ctx.save(); ctx.translate(lerp(-120, 0, tp), 0); introTexts(tp, cy + H * .1, fs); ctx.restore();
  } else {                        // CRTANJE TERENA: linije se crtaju odozgo prema dolje, grb pada
    ctx.save(); ctx.globalAlpha = fade * .92; ctx.fillStyle = '#030a22'; ctx.fillRect(0, 0, W, H); ctx.restore();
    const sy = lerp(0, H, easeIO(clamp((t - 200) / 1600)));
    ctx.save(); ctx.globalAlpha = fade; ctx.beginPath(); ctx.rect(0, 0, W, sy); ctx.clip(); drawPitch(W); ctx.restore();
    ctx.save(); ctx.globalAlpha = fade * (1 - clamp((t - 1800) / 300)); ctx.fillStyle = ACC; ctx.shadowColor = ACC; ctx.shadowBlur = 30; ctx.fillRect(0, sy - 3, W, 6); ctx.restore();
    const cp = clamp((t - 600) / 1000), cyc = lerp(-200, cy - H * .08, easeB(cp));
    ctx.save(); ctx.globalAlpha = fade * clamp((t - 600) / 300); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 40; drawCrest(cx, cyc, Math.min(W, H) * .3); ctx.restore();
    const tp = easeO(clamp((t - 1300) / 600)); introTexts(fade * tp, cy + H * .17 + (1 - tp) * 30, fs);
  }
}
function render(t) { const D = introLen(); if (t < D) drawIntro(t, S.intro); else renderMain(t - D); }

/* ============ 5. PLAY / SNIMANJE / PNG ============ */
let raf = 0, playing = false;
function play(done, limit) {
  cancelAnimationFrame(raf); playing = true; const T = timing(), t0 = performance.now(), end = limit || T.total;
  (function loop(now) {
    const t = now - t0;
    if (t >= end) { playing = false; render(Math.min(end, T.total)); done && done(); return; }
    render(t); raf = requestAnimationFrame(loop);
  })(t0);
}
function showFinal() { if (!playing) render(timing().total); }
$('bPlay').onclick = () => play();
$('bIntro').onclick = () => { if (introLen()) play(null, INTRO_MS - 1); };
$('bPng').onclick = () => { playing = false; cancelAnimationFrame(raf); render(timing().total); cv.toBlob(b => dl(b, 'lineup.png'), 'image/png'); };
function dl(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
$('bRec').onclick = () => {
  if (!window.MediaRecorder || !cv.captureStream) { $('status').textContent = 'Ovaj preglednik ne podržava snimanje. Koristi Chrome.'; return; }
  const types = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mt = types.find(x => MediaRecorder.isTypeSupported(x)) || '';
  const rec = new MediaRecorder(cv.captureStream(30), mt ? { mimeType: mt, videoBitsPerSecond: 12e6 } : { videoBitsPerSecond: 12e6 });
  const ch = []; rec.ondataavailable = e => e.data.size && ch.push(e.data);
  rec.onstop = () => { dl(new Blob(ch, { type: mt || 'video/webm' }), 'lineup.' + (mt.includes('mp4') ? 'mp4' : 'webm')); $('status').textContent = 'Video je spreman i preuzet.'; };
  $('status').textContent = 'Snimam… ne gasi ekran i ne mijenjaj karticu dok ne završi.';
  rec.start(); play(() => setTimeout(() => rec.stop(), 400));
};

/* ============ 6. SUČELJE ============ */
const POS = ['VRATAR'];
function buildList() {
  const rows = rowsOf(), box = $('plist'); box.innerHTML = ''; let i = 0;
  const names = ['VRATAR', 'OBRANA', 'VEZA', 'VEZA / NAPAD', 'NAPAD'];
  rows.forEach((n, k) => {
    const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = k === 0 ? 'VRATAR' : (k === rows.length - 1 ? 'NAPAD' : (k === 1 ? 'OBRANA' : 'VEZA')) + ' (' + n + ')'; box.appendChild(tag);
    for (let j = 0; j < n; j++, i++) {
      const idx = i, p = S.players[idx], r = document.createElement('div'); r.className = 'prow';
      r.innerHTML = `<input class="num" type="text" inputmode="numeric" value="${p.num}"><input class="nm" type="text" placeholder="Ime (npr. L. Livaja)" value="${(p.name || '').replace(/"/g, '&quot;')}"><img id="th${idx}" style="display:none"><label class="fbtn">Fotka<input type="file" accept="image/*" data-i="${idx}"></label><label class="cap"><input type="checkbox" ${p.cap ? 'checked' : ''}>C</label>`;
      const [num, nm, , fb, cap] = [r.children[0], r.children[1], r.children[2], r.children[3], r.children[4]];
      num.oninput = () => { S.players[idx].num = num.value; save(); showFinal(); };
      nm.oninput = () => { S.players[idx].name = nm.value; save(); showFinal(); };
      fb.querySelector('input').onchange = e => { if (e.target.files[0]) setImage('p' + idx, e.target.files[0], 700, 'image/png'); };
      cap.querySelector('input').onchange = e => { S.players.forEach((q, z) => q.cap = false); S.players[idx].cap = e.target.checked; save(); buildList(); showFinal(); };
      box.appendChild(r);
      if (imgs.p[idx]) { const t = r.children[2]; t.src = imgs.p[idx].src; t.style.display = ''; }
    }
  });
}

function bindInputs() {
  const fsel = $('formation'); FORMATIONS.forEach(f => { const o = document.createElement('option'); o.value = f; o.textContent = f; fsel.appendChild(o); });
  $('format').value = S.format; $('format').onchange = () => { S.format = $('format').value; save(); applyFormat(); showFinal(); };
  fsel.value = S.formation; fsel.onchange = () => { S.formation = fsel.value; save(); buildList(); showFinal(); };
  const bind = (id, key, ev = 'input') => { const el = $(id); if (el.type === 'checkbox') el.checked = S[key]; else el.value = S[key]; el.addEventListener(ev, () => { S[key] = el.type === 'checkbox' ? el.checked : (el.type === 'range' ? +el.value : el.value); save(); if (key === 'cutout') rebuildCache(); if (key === 'panelMode') $('subsBox').style.display = S.panelMode === 'subs' ? '' : 'none'; $('dimV').textContent = S.dim + '%'; $('holdV').textContent = (S.hold / 1000).toFixed(1); showFinal(); }); };
  bind('introTitle', 'introTitle'); $('intro').value = S.intro; $('intro').onchange = () => { S.intro = $('intro').value; save(); showFinal(); };
  bind('lineColor', 'lineColor'); document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { S.lineColor = b.dataset.c; $('lineColor').value = S.lineColor; save(); showFinal(); });
  bind('coach', 'coach'); bind('match', 'match'); bind('handle', 'handle'); bind('dim', 'dim'); bind('hold', 'hold'); bind('cutout', 'cutout', 'change');
  bind('panelMode', 'panelMode', 'change'); bind('panelTitle', 'panelTitle'); bind('subs', 'subs');
  $('subsBox').style.display = S.panelMode === 'subs' ? '' : 'none'; $('dimV').textContent = S.dim + '%'; $('holdV').textContent = (S.hold / 1000).toFixed(1);
  $('fCoach').onchange = e => e.target.files[0] && setImage('coach', e.target.files[0], 700, 'image/png');
  $('fCrest').onchange = e => e.target.files[0] && setImage('crest', e.target.files[0], 600, 'image/png');
  $('fLeague').onchange = e => e.target.files[0] && setImage('league', e.target.files[0], 400, 'image/png');
  $('fBg').onchange = e => e.target.files[0] && setImage('bg', e.target.files[0], 1920, 'image/jpeg');
  $('xCrest').onclick = () => removeImage('crest'); $('xLeague').onclick = () => removeImage('league'); $('xBg').onclick = () => removeImage('bg');
}

(async function init() {
  bindInputs();
  for (const k of ['crest', 'league', 'bg', 'coach']) { const d = await idbGet(k); if (d) await applyKey(k, d); }
  for (let i = 0; i < 11; i++) { const d = await idbGet('p' + i); if (d) imgs.p[i] = await loadImg(d); }
  buildList(); rebuildCache();
  try { await document.fonts.load(FONT(800, 40)); await document.fonts.load(FONT(700, 40)); } catch (e) {}
  showFinal();
  window.__dbg = { S, imgs, rebuildCache, render, timing, showFinal, buildList };
})();
