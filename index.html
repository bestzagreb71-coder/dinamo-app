<style>
:root {
  --bg: #070b14;
  --surface: #0d1424;
  --line: #1a2440;
  --text: #e8ecf7;
  --muted: #8b96b5;
  --blue: #4f8ef7;
  --blue-solid: #2f6fed;
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
  --font-ultras: "Oswald", system-ui, sans-serif;
  }
  h1, h2, h3, .logo, .eyebrow, .btn, .filter-btn {
  font-family: var(--font-ultras);
  letter-spacing: 0.04em;
  }
.hero-stat, .cd-unit, .cd-box, .stat-card, #countdown > div, .hero-grid > div {
  background: linear-gradient(145deg, rgba(13, 20, 36, 0.95), rgba(7, 11, 20, 0.98)) !important;
  border: 1px solid rgba(79, 142, 247, 0.35) !important;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(47, 110, 237, 0.2) !important;
  transition: all 0.3s ease !important;
}

.hero-stat:hover, .cd-unit:hover, .cd-box:hover, .stat-card:hover, #countdown > div:hover, .hero-grid > div:hover {
  border-color: rgba(79, 142, 247, 0.75) !important;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6), 0 0 25px rgba(47, 110, 237, 0.4) !important;
}

  
  
html { scroll-padding-top: 72px; background: var(--bg); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font); line-height: 1.55; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

/* ---------- header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 18px 20px;
  background: rgba(7, 11, 20, .86);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.logo { font-weight: 700; font-size: 1.6rem; letter-spacing: .01em; line-height: 1; }
.logo b { color: var(--blue); font-weight: 700; }
.site-header nav { display: flex; gap: 22px; }
.site-header nav a { color: var(--muted); font-size: .98rem; padding: 6px 0; white-space: nowrap; }
.site-header nav a:hover { color: var(--text); }

/* ---------- hero ---------- */
.hero {
  position: relative; overflow: hidden;
  min-height: 78svh;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 72px 20px 56px;
  background:
    radial-gradient(70% 45% at 30% 28%, #12306a 0%, transparent 70%),
    radial-gradient(60% 45% at 100% 40%, #0f2b62 0%, transparent 70%),
    linear-gradient(180deg, #0a1430 0%, #0f1a34 100%);
  border-bottom: 1px solid var(--line);
}
.smoke { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(70px); }
.smoke.a { width: 70vmax; height: 40vmax; left: -20vmax; top: 10%; background: rgba(47, 110, 240, .30); }
.smoke.b { width: 60vmax; height: 34vmax; right: -25vmax; bottom: -6%; background: rgba(190, 210, 255, .12); }
@media (prefers-reduced-motion: no-preference) {
  .smoke.a { animation: drift-a 22s ease-in-out infinite alternate; }
  .smoke.b { animation: drift-b 28s ease-in-out infinite alternate; }
}
@keyframes drift-a { to { transform: translate(18vmax, -4vmax) scale(1.15); } }
@keyframes drift-b { to { transform: translate(-22vmax, -6vmax) scale(1.1); } }

.hero-inner { position: relative; max-width: 1100px; width: 100%; margin: 0 auto; }
.hero { isolation: isolate; border-bottom: 0; }
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -2;
  background: url("foto/Picsart_25-05-10_22-21-24-601%20(4).jpg") center / cover no-repeat;
  filter: grayscale(1);
}
.hero::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    linear-gradient(0deg, #070b14 0%, #070b14 8%, rgba(7, 11, 20, 0) 65%),
    linear-gradient(180deg, rgba(7, 11, 20, .15) 0%, rgba(7, 11, 20, .35) 100%);
}
.hero .smoke { z-index: -1; }
.eyebrow { margin: 0 0 14px; color: var(--blue); font-weight: 500; font-size: .95rem; letter-spacing: .22em; text-transform: uppercase; }
.hero .dzg-wrap { display: inline-block; margin-left: 43px; }
.hero h1 {
  margin: 0; font-weight: 700; text-transform: uppercase;
  font-size: clamp(7rem, 38vw, 16rem); line-height: .88; letter-spacing: .03em;
  color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 3px rgba(255, 255, 255, .6);
}
.hero h1 span { animation: dzgFill .6s ease-out forwards; }
.hero h1 span:nth-child(1) { animation-delay: 3s; }
.hero h1 span:nth-child(2) { animation-delay: 3.4s; }
.hero h1 span:nth-child(3) { animation-delay: 3.8s; }
@keyframes dzgFill { to { -webkit-text-fill-color: #2f6fed; -webkit-text-stroke-color: #2f6fed; } }
.dzg-line { display: flex; height: 3px; margin-top: 14px; }
.dzg-line i { flex: 1; }
.dzg-line i:nth-child(1) { background: #2f6fed; }
.dzg-line i:nth-child(2) { background: #ffffff; }
.dzg-line i:nth-child(3) { background: #000000; }
/* linija na prijelazu prema kontaktu */
.tri-line { position: absolute; top: 0; left: 0; right: 0; height: 3px; display: flex; z-index: 1; }
.tri-line i { flex: 1; }
.tri-line i:nth-child(1) { background: #2f6fed; }
.tri-line i:nth-child(2) { background: #ffffff; }
.tri-line i:nth-child(3) { background: #000000; }
.hero p.lead { margin: 26px 0 0; max-width: 34rem; color: var(--muted); font-size: 1.15rem; font-weight: 300; line-height: 1.7; }
  .countdown { margin-top: 26px; max-width: 30rem; }
.cd-boxes { display: flex; border: 1px solid var(--line); border-radius: 6px; background: rgba(13, 20, 36, .7); }
.cd-box { flex: 1; padding: 14px 4px; text-align: center; }
.cd-box + .cd-box { border-left: 1px solid var(--line); }
.cd-box b { display: block; font-size: 2rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cd-box span { display: block; margin-top: 4px; font-size: .68rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.cd-today { margin: 0 0 12px; color: var(--blue); font-family: "Oswald", sans-serif; font-size: 1.35rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; animation: cdText 1.4s ease-in-out infinite; }
.countdown.hot .cd-boxes { animation: cdGlow 1s ease-in-out infinite; }
.countdown.hot .cd-box b { animation: cdPulse 1s ease-in-out infinite; }
@keyframes cdPulse { 0%,100% { color: #4f8ef7; transform: scale(1); text-shadow: 0 0 0 rgba(79,142,247,0); } 50% { color: #a9c8ff; transform: scale(1.1); text-shadow: 0 0 14px rgba(79,142,247,.9); } }
@keyframes cdGlow { 0%,100% { filter: drop-shadow(0 0 0 rgba(79,142,247,0)); } 50% { filter: drop-shadow(0 0 12px rgba(79,142,247,.75)); } }
@keyframes cdText { 0%,100% { text-shadow: 0 0 0 rgba(79,142,247,0); } 50% { text-shadow: 0 0 16px rgba(79,142,247,.9); } }
@media (prefers-reduced-motion: reduce) { .cd-today, .countdown.hot .cd-boxes, .countdown.hot .cd-box b { animation: none; } }
.btn {
  display: inline-block; margin-top: 30px;
  background: var(--blue-solid); color: #fff;
  padding: 14px 26px; border-radius: 4px; border: 0;
  font-weight: 500; font-size: 1rem; cursor: pointer;
}
.btn:hover { background: #4a82f2; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); margin-top: 0; }
.btn.ghost:hover { border-color: var(--blue); }
a.btn.ghost svg { width: 18px; height: 18px; margin-right: 10px; vertical-align: -3px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* ---------- tražilica u hero sekciji ---------- */
.hero-search {
  position: relative;
  max-width: 100%;
  margin-bottom: 22px;
}
.hero-search svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  stroke: var(--muted);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}
.hero-search input {
  width: 100%;
  padding: 11px 14px 11px 42px;
  background: rgba(13, 20, 36, 0.60);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.95rem;
  font-family: var(--font);
  transition: all 0.2s ease;
}
.hero-search input::placeholder {
  color: var(--muted);
  opacity: 0.75;
}
.hero-search input:focus {
  outline: none;
  background: rgba(13, 20, 36, 0.85);
  border-color: var(--blue);
}
  

/* ---------- sekcije ---------- */
section.block { padding: 72px 20px; }
.wrap { max-width: 1100px; margin: 0 auto; }
h2 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3.2rem); font-weight: 700; text-transform: uppercase; letter-spacing: -.005em; line-height: 1.05; }
.sub { margin: 0 0 30px; max-width: 32rem; color: var(--muted); font-weight: 300; font-size: 1.05rem; }
  /* traka s brojkama */
.stats { display: flex; margin-top: 44px; max-width: 30rem; border: 1px solid var(--line); border-radius: 6px; background: rgba(13, 20, 36, .7); }
.stat { flex: 1; padding: 14px 4px; text-align: center; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { display: block; font-size: 1.7rem; font-weight: 700; line-height: 1.1; color: var(--blue); }
.stat:last-child b { color: var(--blue); }
.stat span { display: block; margin-top: 4px; font-size: .68rem; line-height: 1.3; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

/* albumi */
.albums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 760px) { .albums { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
@media (min-width: 1100px) { .albums { grid-template-columns: repeat(4, 1fr); } }
.album { position: relative; display: block; aspect-ratio: 4 / 5; border-radius: 6px; overflow: hidden; background: var(--surface); }
.album img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: filter .2s; }
.album:hover img { filter: brightness(1.12); }
.album .cap { padding: 60px 14px 14px; background: linear-gradient(180deg, transparent, rgba(3, 6, 12, .92)); }
.album .cap strong { font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; line-height: 1.15; }
.album .cap span { font-size: .82rem; margin-top: 4px; }
.albumbar { margin-bottom: 24px; }
.back {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px;
  color: var(--muted); font-size: .92rem;
}
.back:hover { color: var(--text); border-color: #2b3a63; }
.albumbar h3 { margin: 20px 0 4px; font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 700; text-transform: uppercase; line-height: 1.05; }
.albumbar p { margin: 0; color: var(--muted); font-weight: 300; }
.season-chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 20px; padding-bottom: 4px; }
.sez-chip { flex: none; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: .95rem; cursor: pointer; }
.sez-chip:hover { border-color: var(--blue); }
.sez-chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }

/* galerija */
.grid { columns: 2; column-gap: 10px; }
@media (min-width: 760px) { .grid { columns: 3; column-gap: 14px; } }
@media (min-width: 1100px) { .grid { columns: 4; } }
.tile {
  display: block; position: relative; width: 100%;
  margin: 0 0 10px; padding: 0; border: 0; border-radius: 6px; overflow: hidden;
  background: var(--surface); cursor: zoom-in; text-align: left;
  break-inside: avoid;
}
@media (min-width: 760px) { .tile { margin-bottom: 14px; } }
.tile img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; background: var(--surface); transition: filter .2s; }
.tile:hover img { filter: brightness(1.1); }
.missing { padding: 26px 12px; font-size: .8rem; color: #e39a9a; word-break: break-all; aspect-ratio: 3 / 2; }
.cap {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  padding: 34px 12px 10px;
  background: linear-gradient(180deg, transparent, rgba(3, 6, 12, .88));
}
.cap strong { display: block; font-size: .9rem; font-weight: 500; line-height: 1.25; }
.cap span { display: block; margin-top: 2px; font-size: .76rem; color: #aebadb; }
.empty { padding: 44px 20px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); text-align: center; }
/* pojavljivanje slika */
@media (prefers-reduced-motion: no-preference) {
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }
}
/* o meni + kontakt */
.about { background: var(--surface); border-top: 0; border-bottom: 0; }
  .about, #kontakt { position: relative; isolation: isolate; }
.about::before, #kontakt::before {
  content: ""; position: absolute; inset: 0; z-index: -2;
  background: url("foto/35630-ezremove%20(1).jpg") center / cover no-repeat;
  filter: grayscale(1);
}
  .about::before {
  background: url("foto/1000253004.jpg") center / cover no-repeat;
  }
.about::after, #kontakt::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: rgba(7, 11, 20, .70);
}
.about p { margin: 0 0 16px; max-width: 34rem; color: #b9c3de; font-weight: 300; font-size: 1.1rem; line-height: 1.75; }
.contact-list { display: flex; gap: 12px; flex-wrap: wrap; }
footer { padding: 30px 20px 40px; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---------- lightbox ---------- */
.lb {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 56px 12px 16px;
  background: rgba(3, 6, 12, .95);
}
  /* zoom */
.lb { overflow: hidden; }
.lb-art { touch-action: none; z-index: 1; }
.lb-art img { transform-origin: 50% 50%; will-change: transform; cursor: zoom-in; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
.lb.zoomed .lb-art { overflow: visible; border-radius: 0; }
.lb.zoomed .lb-art img { cursor: grab; }
.lb.zoomed .lb-cap, .lb.zoomed .lb-count { opacity: 0; pointer-events: none; }
.lb-zin { top: 8px; right: 66px; }
.lb-zout { top: 8px; right: 120px; }

.lb-fig { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; touch-action: pan-y; }
.lb-art { position: relative; display: inline-block; line-height: 0; border-radius: 6px; overflow: hidden; }
.lb-art img { display: block; width: auto; height: auto; max-width: 92vw; max-height: 68svh; }
.lb-cap { text-align: center; }
.lb-cap strong { display: block; font-weight: 500; font-size: 1.05rem; }
.lb-cap span { color: var(--muted); font-size: .9rem; }
.lb-btn {
  position: absolute; z-index: 3; width: 46px; height: 46px; border-radius: 50%;
  background: rgba(20, 30, 55, .8); border: 1px solid var(--line); cursor: pointer;
  display: grid; place-items: center;
}
.lb-btn:hover { border-color: var(--blue); }
.lb-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.lb-close { top: 8px; right: 12px; }
.lb-prev { left: 8px; top: 50%; transform: translateY(-50%); }
.lb-next { right: 8px; top: 50%; transform: translateY(-50%); }
.lb-count { position: absolute; top: 20px; left: 16px; color: var(--muted); font-size: .9rem; }
@media (max-width: 600px) {
  .lb-prev, .lb-next { width: 40px; height: 40px; background: rgba(7, 11, 20, .55); }
  .lb-prev { left: 12px; } .lb-next { right: 12px; }
}
/* ---------- O GRUPI: prozorčić ---------- */
.site-header nav .nav-btn { background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--muted); font-size: .98rem; white-space: nowrap; }
.site-header nav .nav-btn:hover { color: var(--text); }
.gm { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(3, 6, 12, .82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.gm-panel { position: relative; width: 100%; max-width: 640px; max-height: 88svh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }

.gm-head .dzg-line { max-width: 120px; margin-top: 12px; }

.gm-close:hover { border-color: var(--blue); }

.gm-body { overflow-y: auto; overscroll-behavior: contain; padding: 22px 24px calc(28px + env(safe-area-inset-bottom, 0px)); }
.gm-intro { margin: 0; color: #b9c3de; font-weight: 300; font-size: 1.05rem; line-height: 1.75; }
.gm .stats { margin-top: 22px; max-width: none; }
.tl { list-style: none; margin: 28px 0 8px; padding: 0 0 0 22px; border-left: 1px solid var(--line); }
.tl li { position: relative; padding: 0 0 26px 18px; }
.tl li::before { content: ""; position: absolute; left: -28px; top: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--blue-solid); box-shadow: 0 0 0 4px rgba(47, 111, 237, .22); }
.tl time { color: var(--blue); font-weight: 500; font-size: .82rem; letter-spacing: .1em; text-transform: uppercase; }
.tl h3 { margin: 2px 0 6px; font-size: 1.15rem; font-weight: 700; text-transform: uppercase; line-height: 1.2; }

@media (prefers-reduced-motion: no-preference) {
  .gm { animation: gm-fade .25s ease; }
  .gm-panel { animation: gm-up .3s ease; }
}
@keyframes gm-fade { from { opacity: 0; } }

}
.gm-sec { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); }
.gm-sec h3 { margin: 0 0 8px; font-size: 1.15rem; font-weight: 700; text-transform: uppercase; line-height: 1.2; }
.gm-sec p { margin: 0; color: #b9c3de; font-weight: 300; line-height: 1.75; }
.gm-body .btn { margin-top: 28px; }

.album { position: relative; display: block; aspect-ratio: 4 / 5; border-radius: 6px; overflow: hidden; background: var(--surface); }
.album img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: filter .2s; }
.album:hover img { filter: brightness(1.12); }
.album .cap { padding: 60px 14px 14px; background: linear-gradient(180deg, transparent, rgba(3, 6, 12, .92)); }
.album .cap strong { font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; line-height: 1.15; }

.albumbar { margin-bottom: 24px; }
.back {

}
.back:hover { color: var(--text); border-color: #2b3a63; }
.albumbar h3 { margin: 20px 0 4px; font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 700; text-transform: uppercase; line-height: 1.05; }
.albumbar p { margin: 0; color: var(--muted); font-weight: 300; }
.season-chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 20px; padding-bottom: 4px; }

.sez-chip:hover { border-color: var(--blue); }
.sez-chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }

/* galerija */
.grid { columns: 2; column-gap: 10px; }
@media (min-width: 760px) { .grid { columns: 3; column-gap: 14px; } }
@media (min-width: 1100px) { .grid { columns: 4; } }
.tile {
  display: block; position: relative; width: 100%;
  margin: 0 0 10px; padding: 0; border: 0; border-radius: 6px; overflow: hidden;
  background: var(--surface); cursor: zoom-in; text-align: left;
  break-inside: avoid;
}
@media (min-width: 760px) { .tile { margin-bottom: 14px; } }
.tile img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; background: var(--surface); transition: filter .2s; }
.tile:hover img { filter: brightness(1.1); }
.missing { padding: 26px 12px; font-size: .8rem; color: #e39a9a; word-break: break-all; aspect-ratio: 3 / 2; }
.cap {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;

/* pojavljivanje slika */

}
/* o meni + kontakt */

/* ---------- lightbox ---------- */
.lb {

.lb.zoomed .lb-art { overflow: visible; border-radius: 0; }

<div class="wrap"><footer id="foot"></footer></div>

<script>
/* prikaz greške na ekranu (ako se nešto pokvari, vidi se što) */
(function(){function show(m){try{var d=document.createElement('pre');d.style.cssText='position:fixed;z-index:99;top:0;left:0;right:0;margin:0;background:#7a0000;color:#fff;padding:10px 12px;font:12px/1.4 monospace;white-space:pre-wrap;word-break:break-all';d.textContent='Greška: '+m;(document.body||document.documentElement).appendChild(d)}catch(_){}}
window.addEventListener('error',function(e){show((e.message||'?')+' ['+(e.lineno||'?')+':'+(e.colno||'?')+']')});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;show((r&&(r.stack||r.message))||String(r))});})();
</script>
<script>
(async function(){
const load=u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(u);return r.json()});
let TEXT,TEAMS,NEWS,PLAYED_ROUNDS,BASE;
try{
  const [tx,tm,nw,se]=await Promise.all([load('content/text.json'),load('content/teams.json'),load('content/news.json'),load('content/season.json')]);
  TEXT=tx;TEAMS=tm.items;NEWS=nw.items;PLAYED_ROUNDS=Number(se.playedRounds)||0;BASE=Date.parse(se.seasonStart);
}catch(err){
  document.getElementById('heroSlot').innerHTML='';document.getElementById('main').innerHTML='';
  document.body.insertAdjacentHTML('afterbegin','<p style="padding:24px;font-weight:600">Podaci se nisu mogli učitati. Provjerite vezu i osvježite stranicu.</p>');
  return;
}
/* ---------- generiranje rasporeda (svi klubovi, 36 kola) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(2026);
function pois(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=rng()}while(p>L);return k-1}
const T = Object.fromEntries(TEAMS.map(t=>[t.id,t]));
function simulate(h,a){
  const d=T[h].str-T[a].str;
  return [pois(Math.max(.3,1.4+.13*d)),pois(Math.max(.25,1.0-.13*d))];
}
function buildRounds(){
  const ids=TEAMS.map(t=>t.id), n=ids.length; let arr=[...ids]; const first=[];
  for(let r=0;r<n-1;r++){
    const round=[];
    for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i]; if((r+i)%2===1)[h,a]=[a,h]; round.push({h,a});}
    first.push(round); arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
  }
  const all=[];
  for(let leg=0;leg<4;leg++) first.forEach(rd=>all.push(rd.map(p=>leg%2?{h:p.a,a:p.h}:p)));
  return all;
}
const SLOTS=[0,2.5,21,23.5,26].map(h=>h*36e5);

/* =========================================================
   PRAVI (STVARNI) REZULTATI — RUČNI UPIS
   ---------------------------------------------------------
   Ovdje upisuješ TOČAN rezultat i TOČNOG domaćina/gosta za bilo
   koju odigranu utakmicu. Ovo potpuno preglasi automatski raspored
   i automatski (izmišljeni) rezultat za tu utakmicu.

   Ključ:   'kolo-DOMAĆIN-GOST'   (kodovi klubova iz content/teams.json)
   Vrijednost: [golovi domaćina, golovi gosta]

   Primjer:
     '9-HAJ-DIN':[1,2]
     → 9. kolo, Hajduk (domaćin) - Dinamo (gost), rezultat 1:2

   Ne moraš paziti na to kako je algoritam "zamislio" raspored —
   samo upiši kako je stvarno bilo, redoslijed domaćin/gost će se
   automatski ispraviti ako je drukčiji od zamišljenog.

   Sve utakmice koje OVDJE NISU upisane i dalje se automatski
   simuliraju kao i do sada.
   ========================================================= */
const REAL_RESULTS={
  // '9-LOk-DIN':[1,5],
  // '10-LOK-DIN':[0,3],
};

const ROUNDS = buildRounds().map((pairs,ri)=>{
  const idx=pairs.findIndex(p=>p.h==='DIN'||p.a==='DIN');
  const others=pairs.filter((_,i)=>i!==idx);
  const ordered=[others[0],pairs[idx],...others.slice(1)];
  return ordered.map((p,si)=>{
    const round=ri+1;
    let h=p.h,a=p.a,hg=null,ag=null;
    if(REAL_RESULTS[round+'-'+h+'-'+a]){
      [hg,ag]=REAL_RESULTS[round+'-'+h+'-'+a];
    }else if(REAL_RESULTS[round+'-'+a+'-'+h]){
      [h,a]=[a,h];
      [hg,ag]=REAL_RESULTS[round+'-'+a+'-'+h];
    }
    const m={round,h,a,ts:BASE+ri*7*864e5+SLOTS[si]};
    if(hg!=null){ m.hg=hg; m.ag=ag; }
    else if(ri<PLAYED_ROUNDS){ [m.hg,m.ag]=simulate(p.h,p.a); }
    return m;
    });
  });

  ROUNDS.forEach(rd=>rd.forEach(m=>{
  if(m.round===9 && m.h==='DIN' && m.a==='HAJ' && !REAL_RESULTS['9-HAJ-DIN'] && !REAL_RESULTS['9-DIN-HAJ']){
    [m.h,m.a]=[m.a,m.h];
    if(m.hg!=null)[m.hg,m.ag]=[m.ag,m.hg];
  }
  if(m.round===10 && m.h==='DIN' && m.a==='LOK' && !REAL_RESULTS['10-LOK-DIN'] && !REAL_RESULTS['10-DIN-LOK']){
    [m.h,m.a]=[m.a,m.h];
    if(m.hg!=null)[m.hg,m.ag]=[m.ag,m.hg];
  }
  
}));


  
const ALL = ROUNDS.flat();
const PLAYED = ALL.filter(m=>m.hg!=null);
const NEXT_DIN = ALL.find(m=>m.hg==null&&(m.h==='DIN'||m.a==='DIN'));

/* ---------- tablica ---------- */
function standings(){
  const s=Object.fromEntries(TEAMS.map(t=>[t.id,{id:t.id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[]}]));
  [...PLAYED].sort((a,b)=>a.ts-b.ts).forEach(m=>{
    const H=s[m.h],A=s[m.a]; H.p++;A.p++; H.gf+=m.hg;H.ga+=m.ag;A.gf+=m.ag;A.ga+=m.hg;
    if(m.hg>m.ag){H.w++;A.l++;H.pts+=3;H.form.push('W');A.form.push('L')}
    else if(m.hg<m.ag){A.w++;H.l++;A.pts+=3;A.form.push('W');H.form.push('L')}
    else{H.d++;A.d++;H.pts++;A.pts++;H.form.push('D');A.form.push('D')}
  });
  return Object.values(s).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
}
const TABLE = standings();

/* =========================================================
   NASLOVNA FOTOGRAFIJA (nije obavezno)
   Učitaj sliku u mapu gallery/ (ili icons/) i upiši put, npr.:
   const HERO_IMG='gallery/stadion.jpg';
   Prazno = plavi gradijent s uzorkom terena.
   ========================================================= */
const HERO_IMG='badblue1.jpg';

/* =========================================================
   GALERIJA
   ---------------------------------------------------------
   1) Fotografije učitaj u mapu  gallery/  u repozitoriju
      (preporuka: širina do 1600 px, do ~500 KB po slici).
   2) Dodaj ih u popis ispod, jedna linija po slici.
   Dok je popis prazan, prikazuju se primjeri.
   ========================================================= */
const GALLERY=[
  // {src:'https://share.google/WqgVgSnJxpqInM2Qb.jpg', caption:'Dinamo – Hajduk 12.9.2026.'},
  // {src:'gallery/slika2.jpg', caption:'Slavlje nakon utakmice'},
];
function placeholder(n){
  const c=['#0A47B8','#06265F','#2A9BD6','#1E8E5A','#5C93F5','#8A94A8'][n%6];
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${c}"/><text x="200" y="220" font-family="Arial" font-weight="800" font-size="120" fill="#fff" fill-opacity=".85" text-anchor="middle">${n+1}</text></svg>`);
}
const DEMO=!GALLERY.length;
const PHOTOS=DEMO?Array.from({length:6},(_,i)=>({src:placeholder(i),caption:'Primjer fotografije '+(i+1)})):GALLERY;
function galleryHTML(){
  const tiles=PHOTOS.map((g,i)=>`<button type="button" data-act="photo" data-i="${i}" aria-label="Otvori fotografiju ${i+1}"><img src="${g.src}" alt="${esc(g.caption||'')}" loading="lazy" onerror="this.closest('button').remove()">${g.caption?`<span class="cap">${esc(g.caption)}</span>`:''}</button>`).join('');
  return `<section><h3>Galerija</h3>${DEMO?'<p class="demo">Ovo su primjeri. Dodaj svoje fotografije u popis GALLERY u kodu.</p>':''}<div class="gal">${tiles}</div></section>`;
}
let gIdx=0;
function showPhoto(i){
  const n=PHOTOS.length; gIdx=(i+n)%n;
  const g=PHOTOS[gIdx], el=document.querySelector('.lb-in'); if(!el) return;
  el.querySelector('.lb-img').src=g.src;
  el.querySelector('.lb-img').alt=g.caption||'';
  el.querySelector('.lb-cap').innerHTML=`${g.caption?esc(g.caption):''}<small>${g.date?esc(g.date)+' · ':''}${gIdx+1} / ${n}</small>`;
}
function openPhoto(i){
  lastFocus=document.activeElement;
  const el=document.createElement('div');
  el.className='modal-back lb';el.dataset.act='bg';
  el.innerHTML=`<button class="modal-x" data-act="close" aria-label="Zatvori">✕</button><div class="lb-in" role="dialog" aria-modal="true" aria-label="Fotografija"><img class="lb-img" alt=""><p class="lb-cap"></p>${PHOTOS.length>1?'<button class="lb-nav p" data-act="gprev" aria-label="Prethodna">‹</button><button class="lb-nav n" data-act="gnext" aria-label="Sljedeća">›</button>':''}</div>`;
  document.body.appendChild(el);document.body.style.overflow='hidden';
  let x0=null;const im=el.querySelector('.lb-img');
  im.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  im.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)showPhoto(gIdx+(dx<0?1:-1))});
  showPhoto(i);
  el.querySelector('.modal-x').focus();
}

/* =========================================================
   STRIJELCI (simulacija) + PROZORČIĆ UTAKMICE
   ---------------------------------------------------------
   Pravi podaci: upiši ih u REAL_GOALS, ključ je 'kolo-DOMAĆIN-GOST'
   npr. '5-DIN-VUK':[{min:12,team:'DIN',player:'I. Prezime'}]
   Sve što nije upisano ovdje simulira se (uvijek isto za istu utakmicu).
   ========================================================= */
const REAL_GOALS={
  // '5-DIN-VUK':[{min:12,team:'DIN',player:'I. Prezime'},{min:67,team:'DIN',player:'I. Prezime'}],
};
const SURN=['Horvat','Kovačić','Babić','Marić','Jurić','Novak','Knežević','Vuković','Petrović','Matić','Tomić','Pavlović','Božić','Perić','Radić','Šimunić','Lovrić','Grgić','Blažević','Kolar','Štimac','Vidović','Mikulić','Barišić'];
const FIRSTL='ABDIJLMNPST';
function h32(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const SQUADS={};
function squad(id){
  if(SQUADS[id]) return SQUADS[id];
  const r=mulberry32(h32('sq'+id)),pool=[...SURN],out=[];
  for(let i=0;i<7;i++){out.push(FIRSTL[Math.floor(r()*FIRSTL.length)]+'. '+pool.splice(Math.floor(r()*pool.length),1)[0])}
  return SQUADS[id]=out;
}
function goalsOf(m){
  const key=m.round+'-'+m.h+'-'+m.a;
  if(REAL_GOALS[key]) return [...REAL_GOALS[key]].sort((a,b)=>a.min-b.min);
  const r=mulberry32(h32('g'+key));
  const mk=(team,n)=>Array.from({length:n},()=>{const sq=squad(team);return {min:1+Math.floor(r()*90),team,player:sq[Math.floor(r()*r()*sq.length)]}});
  return [...mk(m.h,m.hg),...mk(m.a,m.ag)].sort((a,b)=>a.min-b.min);
}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lastFocus=null;
function openMatch(key){
  const m=ALL.find(x=>x.round+'-'+x.h+'-'+x.a===key); if(!m||m.hg==null) return;
  const gs=goalsOf(m);
  const list=(side,away)=>{
    const g=gs.filter(x=>x.team===side);
    if(!g.length) return '<li class="none">Bez golova</li>';
    return g.map(x=>away?`<li>${esc(x.player)} <b>${x.min}'</b> ⚽</li>`:`<li>⚽ <b>${x.min}'</b> ${esc(x.player)}</li>`).join('');
  };
  lastFocus=document.activeElement;
  const el=document.createElement('div');
  el.className='modal-back';el.dataset.act='bg';
  el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Detalji utakmice"><button class="modal-x" data-act="close" aria-label="Zatvori">✕</button>
  <p class="m-round">${m.round}. kolo · ${fmtL.format(m.ts)}</p>
  <div class="m-score"><div class="m-team">${crest(m.h)}<span>${T[m.h].name}</span></div><div class="m-res">${m.hg}:${m.ag}</div><div class="m-team">${crest(m.a)}<span>${T[m.a].name}</span></div></div>
  <div class="m-goals"><ul>${list(m.h,false)}</ul><ul class="a">${list(m.a,true)}</ul></div></div>`;
  document.body.appendChild(el);document.body.style.overflow='hidden';
  el.querySelector('.modal-x').focus();
}
function closeMatch(){
  const el=document.querySelector('.modal-back'); if(!el) return;
  el.remove();document.body.style.overflow='';
  if(lastFocus&&lastFocus.focus) lastFocus.focus();
}

/* =========================================================
   PRIKAZ
   ========================================================= */
const fmtD=new Intl.DateTimeFormat('hr-HR',{weekday:'short',day:'numeric',month:'numeric',timeZone:'Europe/Zagreb'});
const fmtT=new Intl.DateTimeFormat('hr-HR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Zagreb'});
const fmtL=new Intl.DateTimeFormat('hr-HR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Zagreb'});
const $=s=>document.querySelector(s);
const state={tab:'home',res:{round:PLAYED_ROUNDS,club:'ALL'},fix:{round:PLAYED_ROUNDS+1,club:'DIN'},open:null};

const _h=location.hash.slice(1);
if(['home','results','table','fixtures','news','gallery'].includes(_h)) state.tab=_h;
const ICON={
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  results:'<circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/>',
  table:'<path d="M4 6h16M4 12h16M4 18h16"/><path d="M8 4v16" />',
  fixtures:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  news:'<path d="M5 5h11a2 2 0 012 2v12H7a2 2 0 01-2-2z"/><path d="M18 9h2v9a2 2 0 01-2 2M8 9h6M8 13h6"/>',
  gallery:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4 17l5-4 4 3 3-2 4 3"/>'
};
const TABS=[['home','Početna'],['results','Rezultati'],['table','Tablica'],['fixtures','Raspored'],['news','Vijesti'],['gallery','Galerija']];

const crest=id=>`<span class="crest" style="--c:${T[id].color}" aria-hidden="true">${T[id].short}${T[id].logo?`<img src="${T[id].logo}" alt="" loading="lazy" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()">`:''}</span>`;
const tname=id=>`<span class="n-full">${T[id].name}</span><span class="n-short">${T[id].short}</span>`;

function matchRow(m){
  const played=m.hg!=null, din=m.h==='DIN'||m.a==='DIN';
  const mid=played?`<span class="score" aria-label="${m.hg} prema ${m.ag}">${m.hg}<i>:</i>${m.ag}</span>`:`<span class="ko">${fmtT.format(m.ts)}</span>`;
  return `<li class="match${din?' is-din':''}${played?' clickable':''}"${played?` data-act="match" data-key="${m.round}-${m.h}-${m.a}" tabindex="0" role="button" aria-label="Detalji utakmice"`:''}><span class="side home">${tname(m.h)}${crest(m.h)}</span><span class="mid">${mid}</span><span class="side away">${crest(m.a)}${tname(m.a)}</span></li>`;
}
function byDay(ms){
  const g=new Map(); ms.forEach(m=>{const k=fmtD.format(m.ts);(g.get(k)||g.set(k,[]).get(k)).push(m)});
  return [...g].map(([k,a])=>`<h4 class="day">${k}</h4><ul class="matches">${a.map(matchRow).join('')}</ul>`).join('');
}
function byRound(ms){
  const g=new Map(); ms.forEach(m=>{(g.get(m.round)||g.set(m.round,[]).get(m.round)).push(m)});
  return [...g].map(([r,a])=>`<h4 class="day">${r}. kolo · ${fmtD.format(a[0].ts)}, ${fmtT.format(a[0].ts)}</h4><ul class="matches">${a.map(matchRow).join('')}</ul>`).join('');
}
function controls(kind,st,min,max){
  const opts='<option value="ALL">Svi klubovi</option>'+TEAMS.map(t=>`<option value="${t.id}"${st.club===t.id?' selected':''}>${t.name}</option>`).join('');
  const nav=st.club==='ALL'?`<div class="roundnav"><button data-act="round" data-kind="${kind}" data-d="-1" aria-label="Prethodno kolo"${st.round<=min?' disabled':''}>‹</button><strong>${st.round}. kolo</strong><button data-act="round" data-kind="${kind}" data-d="1" aria-label="Sljedeće kolo"${st.round>=max?' disabled':''}>›</button></div>`:'';
  return `<div class="controls">${nav}<label><span class="sr">Odaberi klub</span><select data-act="club" data-kind="${kind}">${opts}</select></label></div>`;
}

/* ---- Početna ---- */
function heroHTML(){
  const m=NEXT_DIN, home=T[m.h], away=T[m.a], d=TABLE.find(x=>x.id==='DIN'), pos=TABLE.indexOf(d)+1;
  return `<section class="hero${HERO_IMG?' has-photo':''}" style="margin:0${HERO_IMG?`;--hero-img:url('${HERO_IMG}')`:''}"><svg class="pitch" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2"><rect x="12" y="12" width="376" height="236"/><line x1="200" y1="12" x2="200" y2="248"/><circle cx="200" cy="130" r="42"/><rect x="12" y="80" width="56" height="100"/><rect x="332" y="80" width="56" height="100"/></svg>
  <div class="wrap"><p class="lead">${TEXT.heroLead} · ${m.round}. kolo</p>
  <div class="hero-crests">${crest(m.h)}${crest(m.a)}</div>
  <h2><span>${home.nick}</span><span class="vs">protiv</span><span>${away.nick}</span></h2>
  <p class="when">${fmtL.format(m.ts)}</p><p class="where">${home.stadium}</p>
  <div class="cd" id="cd" role="timer" aria-label="Odbrojavanje do početka utakmice"></div>
  <div class="standing"><div><b>${pos}.</b><span>mjesto</span></div><div><b>${d.pts}</b><span>bodova</span></div><div><b>${d.w}-${d.d}-${d.l}</b><span>pobjede-neriješeno-porazi</span></div><div><b>${d.gf}:${d.ga}</b><span>golovi</span></div></div></div></section>`;
}
function homeHTML(){
const din=[...PLAYED].filter(m=>m.h==='DIN'||m.a==='DIN').sort((a,b)=>b.ts-a.ts).slice(0,5);
const chips=din.map(m=>{
const home=m.h==='DIN',opp=home?m.a:m.h,g=home?m.hg:m.ag,c=home?m.ag:m.hg,r=g>c?'W':g<c?'L':'D';
return `<div class="chip ${r}"><b>${g}:${c}</b><span>${home?'protiv':'kod'} ${T[opp].short}</span></div>`;
}).join('');
const r=PLAYED_ROUNDS+1;
return `<section><h3 class="forma-head" id="formaHead" role="button" tabindex="0" aria-expanded="false">Forma Dinama</h3><div class="form" aria-label="Zadnjih pet utakmica">${chips}</div><div id="statsPanel" class="stats-panel"></div></section>
<section><div class="row-head"><h3>Sljedeće utakmice · ${r}. kolo</h3><button class="link" data-act="tab" data-tab="fixtures">Cijeli raspored</button></div>${byDay(ROUNDS[r-1])}</section>
<section><div class="row-head"><h3>Zadnji rezultati</h3><button class="link" data-act="tab" data-tab="results">Svi rezultati</button></div>${byDay(ROUNDS[PLAYED_ROUNDS-1])}</section>
<section><div class="row-head"><h3>Vijesti</h3><button class="link" data-act="tab" data-tab="news">Sve vijesti</button></div>${newsHTML(3)}</section>`;
}

/* ---- Rezultati / Raspored ---- */
function resultsHTML(){
  const st=state.res;
  const list=st.club==='ALL'?byDay(ROUNDS[st.round-1]):byRound(PLAYED.filter(m=>m.h===st.club||m.a===st.club).sort((a,b)=>b.ts-a.ts));
  return `<section><h3>Rezultati</h3>${controls('res',st,1,PLAYED_ROUNDS)}${list}</section>`;
}
function fixturesHTML(){
  const din=ALL.filter(m=>m.hg==null&&(m.h==='DIN'||m.a==='DIN'));
  return `<section><h3>Raspored utakmica</h3><p class="sub">Samo utakmice Dinama · preostalo ${din.length}</p>${byRound(din)}</section>`;
}

/* ---- Tablica ---- */
function zone(i){return i===0?'var(--zone-champ)':i<3?'var(--zone-eu)':i===8?'var(--zone-play)':i===9?'var(--zone-rel)':'transparent'}
function tableHTML(){
  const rows=TABLE.map((r,i)=>`<tr class="${r.id==='DIN'?'din':''}"><td class="pos" style="--z:${zone(i)}">${i+1}</td><td class="l club"><span class="in">${crest(r.id)}<span>${T[r.id].name}</span></span></td><td>${r.p}</td><td class="hide-s">${r.w}</td><td class="hide-s">${r.d}</td><td class="hide-s">${r.l}</td><td>${r.gf-r.ga>0?'+':''}${r.gf-r.ga}</td><td class="pts">${r.pts}</td><td class="hide-s"><span class="dots" aria-label="Zadnjih 5: ${r.form.slice(-5).join(' ')}">${r.form.slice(-5).map(f=>`<i class="${f}"></i>`).join('')}</span></td></tr>`).join('');
  return `<section><h3>Tablica</h3><p class="sub">Nakon ${PLAYED_ROUNDS}. kola</p>
  <div class="tablewrap"><table><thead><tr><th>#</th><th class="l">Klub</th><th title="Odigrano">U</th><th class="hide-s" title="Pobjede">P</th><th class="hide-s" title="Neriješeno">N</th><th class="hide-s" title="Porazi">I</th><th title="Gol-razlika">GR</th><th>Bod</th><th class="hide-s">Forma</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="legend"><span style="--z:var(--zone-champ)">Vrh ljestvice</span><span style="--z:var(--zone-eu)">Europska natjecanja</span><span style="--z:var(--zone-play)">Kvalifikacije za ostanak</span><span style="--z:var(--zone-rel)">Ispadanje</span></div></section>`;
}

/* ---- Vijesti ---- */
function newsHTML(n){
  const items=NEWS.slice(0,n||NEWS.length);
  return `<div class="news">${items.map((s,i)=>`<article class="card story${i===0?' feat':''}${state.open===s.title?' open':''}" tabindex="0" role="button" aria-expanded="${state.open===s.title}" data-act="story" data-t="${s.title}">${s.img?`<img src="${s.img}" alt="" loading="lazy" onerror="this.remove()">`:''}<div class="body"><span class="cat">${s.cat}</span><h5>${s.title}</h5><time>${s.time}</time><p>${s.body}</p></div></article>`).join('')}</div>`;
}
function newsPage(){return `<section><h3>Vijesti</h3><p class="demo">${TEXT.newsNote}</p>${newsHTML()}</section>`;}
function ringSVG(pct,color,label,num){
const r=42,c=2*Math.PI*r,off=c-(pct/100)*c;
return `<div class="ring"><div class="ring-wrap"><svg viewBox="0 0 96 96"><circle class="track" cx="48" cy="48" r="${r}"/><circle class="val" cx="48" cy="48" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="ring-num">${num}</div></div><div class="lbl">${label}</div></div>`;
}
function radarSVG(stats){
const labels=[['Napad','attack'],['Obrana','defense'],['Posjed','possession'],['Forma','form'],['Kondicija','fitness']];
const cx=140,cy=130,maxR=90,n=5;
const pt=(i,r)=>{const a=(Math.PI*2*i/n)-Math.PI/2;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
let grids='';
[0.33,0.66,1].forEach(f=>{const pts=[...Array(n)].map((_,i)=>pt(i,maxR*f).join(',')).join(' ');grids+=`<polygon class="grid" points="${pts}"/>`;});
let axes='';labels.forEach((_,i)=>{const [x,y]=pt(i,maxR);axes+=`<line class="axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;});
const dataPts=labels.map(([,key],i)=>pt(i,maxR*(Math.min(100,Math.max(0,stats[key]||0))/100)));
const shape=dataPts.map(p=>p.join(',')).join(' ');
const dots=dataPts.map(p=>`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3.5"/>`).join('');
const lbls=labels.map(([lbl],i)=>{const [x,y]=pt(i,maxR+18);return `<text class="lbl" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${lbl}</text>`;}).join('');
return `<div class="radar"><p class="radar-title">Statistika kluba</p><svg viewBox="0 0 280 260">${grids}${axes}<polygon class="shape" points="${shape}"/>${dots}${lbls}</svg></div>`;
}
function statsPanelHTML(){
const d=TABLE.find(x=>x.id==='DIN');
const winPct=Math.round(100*d.w/d.p),drawPct=Math.round(100*d.d/d.p),lossPct=Math.round(100*d.l/d.p);
const rings=`<div class="rings">${ringSVG(winPct,'var(--win)','Pobjede',winPct+'%')}${ringSVG(drawPct,'var(--draw)','Neriješeno',drawPct+'%')}${ringSVG(lossPct,'var(--loss)','Porazi',lossPct+'%')}</div>`;
const stats=(window.CLUB_STATS)||{attack:75,defense:70,possession:60,form:80,fitness:65};
return rings+radarSVG(stats);
}
/* ---- Render ---- */
function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button data-act="tab" data-tab="${k}"${state.tab===k?' aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${l}</button>`).join('');
  $('#heroSlot').innerHTML=state.tab==='home'?heroHTML():'';
  $('#main').innerHTML={home:homeHTML,results:resultsHTML,table:tableHTML,fixtures:fixturesHTML,news:newsPage,gallery:galleryHTML}[state.tab]();
  tick();
}
function animateIn(){
  [$('#main'),$('#heroSlot')].forEach(el=>{el.classList.remove('fade-in');void el.offsetWidth;el.classList.add('fade-in');setTimeout(()=>el.classList.remove('fade-in'),900)});
  $('#main').removeAttribute('aria-busy');
}
function tick(){
  const el=$('#cd'); if(!el) return;
  const diff=NEXT_DIN.ts-Date.now();
  if(diff<=0){el.outerHTML='<p class="live" id="cd">Utakmica je počela ili je završena.</p>';return;}
  const s=Math.floor(diff/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60;
  const p=n=>String(n).padStart(2,'0');
  el.innerHTML=`<div><b>${d}</b><span>dana</span></div><div><b>${p(h)}</b><span>sati</span></div><div><b>${p(m)}</b><span>min</span></div><div><b>${p(c)}</b><span>sek</span></div>`;
}
setInterval(tick,1000);

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act;
  if(a==='tab'){state.tab=t.dataset.tab;try{history.replaceState(null,'','#'+state.tab)}catch(_){}render();animateIn();window.scrollTo({top:0})}
  else if(a==='round'){const st=state[t.dataset.kind],lim=t.dataset.kind==='res'?[1,PLAYED_ROUNDS]:[PLAYED_ROUNDS+1,ROUNDS.length];st.round=Math.min(lim[1],Math.max(lim[0],st.round+ +t.dataset.d));render()}
  else if(a==='story'){state.open=state.open===t.dataset.t?null:t.dataset.t;render()}
  else if(a==='match'){openMatch(t.dataset.key)}
  else if(a==='photo'){openPhoto(+t.dataset.i)}
  else if(a==='gprev'){showPhoto(gIdx-1)}
  else if(a==='gnext'){showPhoto(gIdx+1)}
  else if(a==='close'){closeMatch()}
  else if(a==='bg'){if(e.target===t) closeMatch()}
});document.addEventListener('click',e=>{
const h=e.target.closest('#formaHead'); if(!h) return;
const open=h.classList.toggle('open');
h.setAttribute('aria-expanded',open);
const p=document.getElementById('statsPanel');
p.classList.toggle('open',open);
if(open) p.innerHTML=statsPanelHTML();
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-act="club"]'); if(!t) return;
  state[t.dataset.kind].club=t.value; render();
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act="story"],[data-act="match"]')){e.preventDefault();e.target.click()}
  if(e.key==='Escape') closeMatch();
  if(document.querySelector('.lb')){if(e.key==='ArrowLeft')showPhoto(gIdx-1);if(e.key==='ArrowRight')showPhoto(gIdx+1)}
});
document.getElementById('brandTxt').innerHTML=TEXT.brandName+' <small>'+TEXT.brandSub+'</small>';
document.getElementById('foot').textContent=TEXT.footer;
render();animateIn();

/* =========================================================
   PWA: servisni radnik, instalacija, izvan mreže
   ========================================================= */
function toast(msg,ms){
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),ms||3500);
}
if('serviceWorker' in navigator){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController||reloaded) return; reloaded=true; toast('Nova verzija je spremna.',1500); setTimeout(()=>location.reload(),1200);
  });
}
window.addEventListener('offline',()=>toast('Nema interneta. Prikazuju se spremljeni podaci.',4500));
window.addEventListener('online',()=>toast('Ponovno ste na mreži.',2500));

const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
let deferred=null;
const dismissed=()=>{try{return localStorage.getItem('installDismissed')==='1'}catch(_){return false}};
function showInstall(kind){
  if(isStandalone||dismissed()||document.querySelector('.install')) return;
  const b=document.createElement('div');b.className='install';b.setAttribute('role','dialog');b.setAttribute('aria-label','Instalacija aplikacije');
  b.innerHTML=`<img class="mark" src="icons/icon-192.png" alt=""><p><b>Instaliraj aplikaciju</b>${kind==='ios'?'Dodirnite Podijeli, zatim "Dodaj na početni zaslon".':'Brži pristup i rad bez interneta.'}</p>${kind==='ios'?'':'<button class="go">Instaliraj</button>'}<button class="x" aria-label="Zatvori">✕</button>`;
  document.body.appendChild(b);
  b.querySelector('.x').onclick=()=>{try{localStorage.setItem('installDismissed','1')}catch(_){}b.remove()};
  const go=b.querySelector('.go');
  if(go) go.onclick=async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; b.remove(); };
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;setTimeout(()=>showInstall('native'),4000)});
window.addEventListener('appinstalled',()=>{document.querySelector('.install')?.remove();toast('Aplikacija je instalirana.')});
if(isIOS&&!isStandalone) setTimeout(()=>showInstall('ios'),5000);
})();
</script>
</body>
</html>
