.bg{position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 70px,rgba(232,40,30,.10) 70px 140px)}.has .bg{display:none}

.big{position:absolute;left:192px;top:20px;font-size:96px;font-weight:700;line-height:1;color:var(--nbig,var(--red))}.pos{position:absolute;left:194px;top:118px;font-size:22px;letter-spacing:.28em;color:var(--gold)}

.sub{background:var(--red);padding:4px 16px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:17px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;background:#fff;color:var(--deep);border-bottom:2px solid #d5dcef;font-size:23px;transition:.2s}.row.on{background:var(--blue);color:#fff}.row:not(.in){display:none}
.rn{width:28px;text-align:center;font-weight:700;color:var(--nlist,var(--red))}.row.on .rn{color:#fff}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--deep));color:#fff;border:2px solid var(--gold);display:grid;place-items:center;font-size:14px;font-weight:700;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
.nm{flex:1}.nm span{margin-right:6px;font-weight:400;opacity:.8}.nm b{text-transform:uppercase;letter-spacing:.03em}.rp{font-size:13px;letter-spacing:.12em;opacity:.55}.cp{color:var(--gold);border:1px solid var(--gold);font-size:12px;padding:0 4px;border-radius:3px;margin-left:6px;font-weight:700;font-style:normal}

.p{position:absolute;transform:translate(-50%,-50%);text-align:center;width:150px}.p:not(.in){opacity:0}

.cap .dot::after{content:"C";position:absolute;right:-10px;top:-10px;background:var(--gold);color:var(--deep);width:22px;height:22px;border-radius:50%;font-size:14px;display:grid;place-items:center}
.bar{position:absolute;left:0;right:0;bottom:0;height:54px;background:var(--deep);border-top:4px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:24px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
.intro{display:none;position:absolute;inset:0;z-index:20;place-items:center;background:var(--deep) repeating-linear-gradient(135deg,transparent 0 60px,rgba(232,40,30,.12) 60px 120px);animation:fadeOut .4s 1.6s forwards,hide .01s 2.1s forwards}.play .intro{display:grid}

@keyframes sq{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1.07)}}@keyframes wipe{to{transform:translateX(101%)}}@keyframes wipe2{0%{transform:translateX(-101%)}27%,55%{transform:translateX(0)}100%{transform:translateX(101%)}}@keyframes fadeOut{to{opacity:0}}@keyframes bgOut{to{background:transparent}}@keyframes hide{to{visibility:hidden}}

$("ed").addEventListener("input",e=>{const t=e.target,p=t.dataset.p;if(!p)return;if(p=="pt.name"){Object.assign(cfg.pt,PT[t.value],{name:t.value});buildEd()}else if(p=="formation"){cfg.formation=t.value;cfg.players.forEach((q,i)=>q.pos=F[t.value][i][0]);buildEd()}else set(p,(t.type=="range")?+t.value:t.value);refresh()});

async function makeVideo(){
 if(!window.html2canvas||!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){$("rc").className="on";$("rct").textContent="Ovaj preglednik ne podržava izradu videa. Probaj Chrome.";return}
 const M=FM[cfg.fmt]||FM.w,W=M.W,H=M.H,N=cfg.players.length;
 hideRes();$("rcb").style.display="none";$("rc").className="on";
 const t=S.style.transform,l=S.style.left,tp=S.style.top;capt=1;S.style.transform="none";S.style.left="0";S.style.top="0";
 T.forEach(clearTimeout);T=[];S.classList.remove("play");render();
 const fr=[],dur=[];
 const grab=async()=>{const c=await html2canvas(S,{width:W,height:H,scale:1,backgroundColor:null,useCORS:true,logging:false});const f=mk(),x=f.getContext("2d");x.fillStyle=cfg.c2;x.fillRect(0,0,W,H);x.drawImage(c,0,0,W,H);return f};
 const mk=()=>{const c=document.createElement("canvas");c.width=W;c.height=H;return c};
 try{
  const ic=mk(),g=ic.getContext("2d");g.fillStyle=cfg.c2;g.fillRect(0,0,W,H);
  if(cfg.bg&&cfg.bg.src&&cfg.bg.type!="video"){const bi=new Image();bi.src=cfg.bg.src;try{await bi.decode();const k=Math.max(W/bi.naturalWidth,H/bi.naturalHeight),w=bi.naturalWidth*k,h=bi.naturalHeight*k;g.drawImage(bi,(W-w)/2,(H-h)/2,w,h);g.fillStyle="rgba(0,0,0,"+(cfg.dim/100)+")";g.fillRect(0,0,W,H);g.fillStyle=rgba(cfg.c2,.55);g.fillRect(0,0,W,H)}catch(e){}}
  g.save();g.translate(W/2,H/2);g.rotate(Math.PI/4);g.fillStyle="rgba(232,40,30,.12)";{const D=Math.hypot(W,H);for(let x=-D;x<D;x+=120)g.fillRect(x,-D,60,2*D)}g.restore();
  const im=new Image();im.src=cfg.logo;try{await im.decode()}catch(e){}
  if(im.naturalWidth){const k=Math.min(W*.5/im.naturalWidth,H*.35/im.naturalHeight),w=im.naturalWidth*k,h=im.naturalHeight*k;g.drawImage(im,(W-w)/2,H*.3-h/2+H*.1,w,h)}
  g.fillStyle="#fff";g.textAlign="center";g.font="700 "+Math.round(W*.06)+"px 'Barlow Condensed',Arial,sans-serif";g.fillText((cfg.club||"").toUpperCase(),W/2,H*.62);
  fr.push(ic);dur.push(2000);
  for(let k=0;k<=N;k++){
   const n=k<N?k:N-1;
   rows.forEach((r,j)=>r.classList.toggle("in",j<=n));pls.forEach((x,j)=>x.classList.toggle("in",j<=n));
   if(k<N)show(k);else{show(-1);rows.forEach(r=>r.classList.remove("on"))}
   $("cph").style.animation="none";
   $("rct").textContent="Pripremam sličice "+(k+1)+"/"+(N+1)+"…";
   if(k<N){const r0=rows[k];r0.style.cssText="transition:none;opacity:.3;transform:translateX(-110px)";await new Promise(r=>setTimeout(r,200));fr.push(await grab());dur.push(150);r0.style.cssText=""}
   await new Promise(r=>setTimeout(r,400));
   fr.push(await grab());dur.push(k<N?Math.max(600,cfg.step*1000-150):3500);
  }
 }catch(e){capt=0;S.style.transform=t;S.style.left=l;S.style.top=tp;final();fit();$("rct").textContent="Greška pri izradi sličica. Probaj ponovno.";$("rcb").style.display="flex";return}
 capt=0;S.style.transform=t;S.style.left=l;S.style.top=tp;final();fit();
 $("rct").textContent="Slažem video… ne zatvaraj stranicu";
 const cv=mk(),cx=cv.getContext("2d"),stream=cv.captureStream(30);
 const mt=["video/mp4","video/webm;codecs=vp9","video/webm"].find(m=>MediaRecorder.isTypeSupported(m));
 let mr;try{mr=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:6e6}:undefined)}catch(e){$("rct").textContent="Snimanje videa nije podržano.";$("rcb").style.display="flex";return}
 const ch=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
 mr.onstop=()=>{const ty=mr.mimeType||"video/webm",nm=(cfg.club||"lineup").replace(/\W+/g,"_")+"_"+(cfg.fmt||"w")+"."+(ty.includes("mp4")?"mp4":"webm"),b=new Blob(ch,{type:ty});showRes(URL.createObjectURL(b),nm,b)};
 const total=dur.reduce((a,b)=>a+b,0),t0=performance.now();mr.start(200);

  cx.fillStyle=cfg.c2;cx.fillRect(0,0,W,H);
  const into=e-a;if(i>0&&into<140){cx.drawImage(fr[i-1],0,0);cx.globalAlpha=into/140;cx.drawImage(fr[i],0,0);cx.globalAlpha=1}else cx.drawImage(fr[i],0,0);
  if(e>=total){clearInterval(iv);setTimeout(()=>mr.stop(),250)}},33);
}

 if(auto){try{const st=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:false,preferCurrentTab:true});const mt=["video/mp4","video/webm;codecs=vp9","video/webm"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));mr=new MediaRecorder(st,mt?{mimeType:mt}:undefined);mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};

onkeydown=e=>{if(e.key=="Escape"&&document.body.classList.contains("rec"))recEnd()};
